name: Silea CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-3
  ECR_BACKEND_REPOSITORY: silea-backend
  ECR_FRONTEND_REPOSITORY: silea-frontend

jobs:
  # ============================================
  # Stage 1: Detect Changes
  # ============================================
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Backend/**'
            frontend:
              - 'Frontend/**'

  # ============================================
  # Stage 2: Backend Build & Test
  # ============================================
  backend:
    name: ☕ Backend Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: silea_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: Backend/pom.xml

      - name: 🔨 Build & Test
        working-directory: Backend
        run: mvn clean verify -B
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/silea_test_db?useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: testpassword

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: Backend/target/surefire-reports/
          retention-days: 7

      - name: 📦 Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: Backend/target/*.jar
          retention-days: 1

  # ============================================
  # Stage 3: Frontend Build
  # ============================================
  frontend:
    name: ⚛️ Frontend Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: ⬢ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 📦 Install pnpm
        run: npm install -g pnpm@9

      - name: 📦 Install dependencies
        working-directory: Frontend
        run: pnpm install --no-frozen-lockfile

      - name: 🔍 Lint
        working-directory: Frontend
        run: pnpm lint
        continue-on-error: true

      - name: 🔨 Build
        working-directory: Frontend
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://35.180.229.121:8080
          NEXT_TELEMETRY_DISABLED: 1

      - name: 📦 Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            Frontend/.next/standalone
            Frontend/.next/static
            Frontend/public
          retention-days: 1

  # ============================================
  # Stage 4: Performance Testing (JMeter)
  # ============================================
  performance-test:
    name: 📊 Performance Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: silea_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      - name: 📥 Download Backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./backend-jar

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🚀 Start Backend
        run: |
          java -jar backend-jar/*.jar &
          sleep 30
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/silea_test_db?useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: testpassword

      - name: 📊 Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: 🧪 Run Performance Tests
        run: |
          echo "⏭️ Performance tests configured"

  # ============================================
  # Stage 5: Build & Push to ECR
  # ============================================
  docker:
    name: 🐳 Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: 🐳 Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            NEXT_PUBLIC_API_URL=https://xn--sila-dpa.com
          no-cache: true

  # ============================================
  # Stage 6: Security Scan
  # ============================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      security-events: write
    
    steps:
      - uses: actions/checkout@v4

      - name: 🔍 Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: 📤 Upload to Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================
  # Stage 7: Deploy to EC2
  # ============================================
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: [docker, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 📝 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 📝 Create .env file
        run: |
          cat > .env << 'EOF'
          # Database Configuration
          SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/silea_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME=root
          SPRING_DATASOURCE_PASSWORD=SileaDB2026!Secure
          
          # Email Configuration
          EMAIL_ENABLED=true
          EMAIL_HOST=smtp.gmail.com
          EMAIL_PORT=587
          EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM=official@xn--sila-dpa.com
          EMAIL_FROM_NAME=Silea
          
          # Monday.com Configuration
          MONDAY_ENABLED=${{ secrets.MONDAY_ENABLED || 'true' }}
          MONDAY_API_TOKEN=${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_ID=${{ secrets.MONDAY_BOARD_ID }}
          
          # Sendit Configuration
          SENDIT_ENABLED=true
          SENDIT_API_URL=https://api.sendit.ma/v1
          SENDIT_PUBLIC_KEY=${{ secrets.SENDIT_PUBLIC_KEY || '' }}
          SENDIT_PRIVATE_KEY=${{ secrets.SENDIT_PRIVATE_KEY || '' }}
          SENDIT_SYNC_INTERVAL=5
          
          # Spring Profile
          SPRING_PROFILES_ACTIVE=prod
          
          # MySQL Configuration
          MYSQL_ROOT_PASSWORD=SileaDB2026!Secure
          MYSQL_DATABASE=silea_db
          
          # phpMyAdmin
          PMA_HOST=mysql
          PMA_USER=root
          PMA_PASSWORD=SileaDB2026!Secure
          EOF

      - name: 📤 Upload files to EC2
        run: |
          scp -i ~/.ssh/ec2-key.pem -o StrictHostKeyChecking=no docker-compose.prod.yml ec2-user@${{ secrets.EC2_HOST }}:/opt/silea/
          scp -i ~/.ssh/ec2-key.pem -o StrictHostKeyChecking=no .env ec2-user@${{ secrets.EC2_HOST }}:/opt/silea/

      - name: 🚀 Deploy on EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          ssh -i ~/.ssh/ec2-key.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=10 ec2-user@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            
            echo "🔐 Logging into ECR..."
            aws ecr get-login-password --region eu-west-3 | docker login --username AWS --password-stdin 442147575154.dkr.ecr.eu-west-3.amazonaws.com
            
            echo "📂 Navigating to application directory..."
            cd /opt/silea
            
            echo "📥 Pulling latest Docker images..."
            docker-compose -f docker-compose.prod.yml pull
            
            echo "🚀 Deploying with docker-compose..."
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            
            echo "⏳ Waiting for services to be healthy..."
            sleep 45
            
            echo "🧹 Cleaning up old images..."
            docker image prune -af --filter "until=24h" || true
            
            echo ""
            echo "✅ Deployment Complete!"
            docker-compose -f docker-compose.prod.yml ps
          ENDSSH

      - name: ✅ Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live URLs:" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** http://${{ secrets.EC2_HOST }}:3000" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend API:** http://${{ secrets.EC2_HOST }}:8080/api" >> $GITHUB_STEP_SUMMARY
          echo "- **phpMyAdmin:** http://${{ secrets.EC2_HOST }}:8081" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Deployed Version:" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✨ Test Your Application:" >> $GITHUB_STEP_SUMMARY
          echo "1. **Frontend:** Browse products and add to cart" >> $GITHUB_STEP_SUMMARY
          echo "2. **Backend API:** \`curl http://${{ secrets.EC2_HOST }}:8080/api/products\`" >> $GITHUB_STEP_SUMMARY
          echo "3. **Database:** Access phpMyAdmin to verify data" >> $GITHUB_STEP_SUMMARY
          
      - name: 🧪 Health Check
        run: |
          echo "🔍 Running health checks..."
          sleep 5
          
          # Check backend
          if curl -f -s http://${{ secrets.EC2_HOST }}:8080/api/products > /dev/null; then
            echo "✅ Backend is healthy"
            echo "- ✅ Backend API responding" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Backend health check failed"
            echo "- ❌ Backend API not responding" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check frontend
          if curl -f -s http://${{ secrets.EC2_HOST }}:3000 > /dev/null; then
            echo "✅ Frontend is healthy"
            echo "- ✅ Frontend responding" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Frontend health check failed"
            echo "- ❌ Frontend not responding" >> $GITHUB_STEP_SUMMARY
          fi