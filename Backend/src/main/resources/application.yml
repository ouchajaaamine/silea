server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/silea_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
  
  sql:
    init:
      mode: always
  
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

thirdparty:
  twilio:
    accountSid: "YOUR_TWILIO_ACCOUNT_SID"
    authToken: "YOUR_TWILIO_AUTH_TOKEN"

# Monday.com Integration Configuration
monday:
  enabled: ${MONDAY_ENABLED:true}
  api-token: ${MONDAY_API_TOKEN}
  board-id: ${MONDAY_BOARD_ID}
  api-url: https://api.monday.com/v2

# WhatsApp Integration Configuration (DEPRECATED - using Email now)
whatsapp:
  enabled: false
  account-sid: ${WHATSAPP_ACCOUNT_SID:}
  auth-token: ${WHATSAPP_AUTH_TOKEN:}
  messaging-service-sid: ${WHATSAPP_MESSAGING_SERVICE_SID:}
  from-number: ${WHATSAPP_FROM_NUMBER:}

# Email Configuration (Replaces WhatsApp)
email:
  enabled: ${EMAIL_ENABLED:true}
  host: ${EMAIL_HOST:smtp.gmail.com}
  port: ${EMAIL_PORT:587}
  username: ${EMAIL_USERNAME}
  password: ${EMAIL_PASSWORD}
  from-address: ${EMAIL_FROM}
  from-name: ${EMAIL_FROM_NAME:Silea}
  smtp-auth: true
  smtp-starttls-enable: true
  smtp-starttls-required: true

# Sendit.ma Integration Configuration
sendit:
  enabled: ${SENDIT_ENABLED:true}
  api-url: ${SENDIT_API_URL:https://api.sendit.ma/v1}
  public-key: ${SENDIT_PUBLIC_KEY}
  private-key: ${SENDIT_PRIVATE_KEY}
  sync-interval-minutes: ${SENDIT_SYNC_INTERVAL:5}