services:
  mysql:
    image: mysql:8.0
    container_name: silea-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-silea_db}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: 442147575154.dkr.ecr.eu-west-3.amazonaws.com/silea-backend:latest
    container_name: silea-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Silea}
      SENDIT_ENABLED: ${SENDIT_ENABLED:-true}
      SENDIT_API_URL: ${SENDIT_API_URL:-https://api.sendit.ma/v1}
      SENDIT_PUBLIC_KEY: ${SENDIT_PUBLIC_KEY}
      SENDIT_PRIVATE_KEY: ${SENDIT_PRIVATE_KEY}
      SENDIT_SYNC_INTERVAL: ${SENDIT_SYNC_INTERVAL:-5}
      MONDAY_ENABLED: ${MONDAY_ENABLED:-true}
      MONDAY_API_TOKEN: ${MONDAY_API_TOKEN}
      MONDAY_BOARD_ID: ${MONDAY_BOARD_ID}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  frontend:
    image: 442147575154.dkr.ecr.eu-west-3.amazonaws.com/silea-frontend:latest
    container_name: silea-frontend
    environment:
      NEXT_PUBLIC_API_URL: https://xn--sila-dpa.com
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: silea-phpmyadmin
    environment:
      PMA_HOST: ${PMA_HOST:-mysql}
      PMA_USER: ${PMA_USER:-root}
      PMA_PASSWORD: ${PMA_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - mysql
    restart: always

volumes:
  mysql_data:

